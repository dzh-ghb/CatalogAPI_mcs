name: catalog-api

services:
  postgres:
    image: postgres:18
    container_name: postgres-catalog
    environment:
      POSTGRES_DB: catalog-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres-data:
